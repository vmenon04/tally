<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tally</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d1f21; --table-border: #dcdcd8; --bar: #ffffff; --link: #2f63a8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1c1e; --fg: #e6e6e3; --table-border: #3a3b3e; --bar: #232427; --link: #8fb4ec; }
  }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--link); }
  header { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px;
           padding: 10px 16px; background: var(--bar); border-bottom: 1px solid var(--table-border); }
  header b { font-size: 1.1em; } header .t-space { flex: 1; }
  main { padding: 8px 16px 40px; max-width: 960px; margin: 0 auto; }
  .t-errors { background: rgba(200,66,59,.12); border: 1px solid rgba(200,66,59,.5);
              border-radius: 8px; padding: 8px 12px; margin: 12px 0; }
  select, button, textarea { font: inherit; color: inherit; background: var(--bar);
                             border: 1px solid var(--table-border); border-radius: 6px; padding: 5px 8px; }
  button { cursor: pointer; background: var(--link); color: #fff; border-color: transparent; }
</style>
</head>
<body>
<header>
  <b>Tally</b><span class="t-space"></span>
  <a href="{{ fava.page('income_statement') }}">Fava: all the details →</a>
</header>
<main>
  {% if errors %}
  <div class="t-errors">The ledger has {{ errors }} error{{ 's' if errors != 1 }}, so some numbers may be off.
    <a href="{{ fava.page('errors') }}">See them in Fava</a>.</div>
  {% endif %}
  {{ body }}
</main>
</body>
</html>
