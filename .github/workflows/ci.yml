name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: bin/check
      - name: Sure's compose file is valid
        run: docker compose -f deploy/sure/compose.yml config --quiet
        env:
          SECRET_KEY_BASE: check
          POSTGRES_PASSWORD: check
          CHAT_TOKEN: check
          MCP_TOKEN: check
          MCP_USER_EMAIL: check@example.com

  image:
    # Builds the image on every push and checks it runs; on main, once the checks pass,
    # publishes it as ghcr.io/vmenon04/tally:<commit>, the tag a deployment names.
    needs: [check, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build --tag "$IMAGE" .
      - name: It runs
        run: |
          docker run --rm "$IMAGE" --help
          docker run --rm --entrypoint claude "$IMAGE" --version
      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"

  secrets:
    # Every commit, not just the newest: a secret removed later is still in the history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secrets in the history (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          git /repo --no-banner --redact --verbose
