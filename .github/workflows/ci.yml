name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: bin/check
      - name: Sure's compose file is valid
        run: docker compose -f deploy/sure/compose.yml config --quiet
        env:
          SECRET_KEY_BASE: check
          POSTGRES_PASSWORD: check
          CHAT_TOKEN: check
          MCP_TOKEN: check
          MCP_USER_EMAIL: check@example.com

  image:
    # Builds the image on every push and checks it runs. A version tag (v0.2.0), once the
    # checks pass, publishes it as ghcr.io/vmenon04/tally:0.2.0, the version homelab names.
    needs: [check, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build --tag "$IMAGE:test" .
      - name: It runs
        run: |
          docker run --rm "$IMAGE:test" --help
          docker run --rm --entrypoint claude "$IMAGE:test" --version
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! grep -qx "version = \"$version\"" pyproject.toml; then
            echo "::error::$GITHUB_REF_NAME doesn't match the version in pyproject.toml"
            exit 1
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:test" "$IMAGE:$version"
          docker push "$IMAGE:$version"

  secrets:
    # Every commit, not just the newest: a secret removed later is still in the history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secrets in the history (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          git /repo --no-banner --redact --verbose
