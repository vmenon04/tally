name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: bin/check
      - name: Sure's compose file is valid
        run: docker compose -f deploy/sure/compose.yml config --quiet
        env:
          SECRET_KEY_BASE: check
          POSTGRES_PASSWORD: check
          CHAT_TOKEN: check
          MCP_TOKEN: check
          MCP_USER_EMAIL: check@example.com
