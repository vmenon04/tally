[project]
name = "tally"
version = "0.1.0"
description = "Personal finance tracker: imports transactions, categorizes them, and updates a Google Sheet budget."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beancount>=3.2",
    "beangulp>=0.2",
    "google-auth>=2.62.0",
    "requests>=2.34.2",
]

[project.scripts]
tally = "tally.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear
    "UP",      # modern syntax
    "SIM",     # simplifications
    "DTZ",     # timezone-naive datetimes
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["beangulp", "beangulp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
