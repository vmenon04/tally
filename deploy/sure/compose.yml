# Sure (https://github.com/we-promise/sure), the web and phone UI tally fills from the ledger.
# Installed as /srv/sure/compose.yml, next to an owner-only .env holding SECRET_KEY_BASE,
# POSTGRES_PASSWORD, CHAT_TOKEN, MCP_TOKEN and MCP_USER_EMAIL. See docs/server.md.
#
# The ledger stays the record: everything in Sure's database can be pushed again by tally.
# Sure listens on 127.0.0.1 only; `tailscale serve` puts it at the server's tailnet address.
# SURE_PORT, SURE_BRAND, TALLY_CHAT_DIR and RAILS_ASSUME_SSL default to the server's set-up;
# demo/make_demo.py --sure changes them to run a throwaway copy on your own machine.
# Its chat is answered by tally (see tally-chat below); its other AI features, bank
# connections and email are left unconfigured: tally does that work.

name: sure

x-db-env: &db_env
  POSTGRES_USER: sure
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
  POSTGRES_DB: sure_production

x-rails-env: &rails_env
  <<: *db_env
  # Signs sessions and derives the keys that encrypt API keys at rest. Never change it
  # once the database has data.
  SECRET_KEY_BASE: "${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}"
  SELF_HOSTED: "true"
  # Its name in titles, the phone's home screen and emails; brand/ has the logo.
  PRODUCT_NAME: tally
  # tailscale serve terminates HTTPS; tally itself calls plain http://127.0.0.1:3200.
  RAILS_ASSUME_SSL: "${RAILS_ASSUME_SSL:-true}"
  RAILS_FORCE_SSL: "false"
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/1
  # The chat goes to `tally chat`, through the relay below.
  ASSISTANT_TYPE: external
  EXTERNAL_ASSISTANT_URL: http://tally-chat/v1/chat/completions
  EXTERNAL_ASSISTANT_TOKEN: "${CHAT_TOKEN:?set CHAT_TOKEN in .env}"
  EXTERNAL_ASSISTANT_MODEL: tally
  # tally lookups reads your data for the chat at /mcp with this token, as this user.
  MCP_API_TOKEN: "${MCP_TOKEN:?set MCP_TOKEN in .env}"
  MCP_USER_EMAIL: "${MCP_USER_EMAIL:?set MCP_USER_EMAIL in .env}"

x-sure: &sure
  # Pinned: upgrade by changing the tag here, after reading the release notes.
  image: ghcr.io/we-promise/sure:0.7.6-hotfix.1
  restart: unless-stopped
  volumes:
    - app-storage:/rails/storage
  environment:
    <<: *rails_env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *sure
    ports:
      - "127.0.0.1:${SURE_PORT:-3200}:3000"
    # brand/apply puts tally's logo in place of Sure's, then starts the server as usual.
    volumes:
      - app-storage:/rails/storage
      - ${SURE_BRAND:-/srv/sure/brand}:/tally-brand:ro
    entrypoint: ["/tally-brand/apply"]
    command: ["./bin/rails", "server"]

  worker:
    <<: *sure
    command: bundle exec sidekiq

  # Passes Sure's chat to `tally chat` on its Unix socket. It has no port on the server, so
  # only Sure's containers reach it.
  tally-chat:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    volumes:
      - ${TALLY_CHAT_DIR:-/srv/tally-chat}:/run/tally-chat
    configs:
      - source: tally-chat
        target: /etc/nginx/conf.d/default.conf

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      <<: *db_env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

configs:
  tally-chat:
    content: |
      server {
          listen 80;
          access_log off;
          location / {
              proxy_pass http://unix:/run/tally-chat/chat.sock;
              # Claude takes a while; tally sends a comment every few seconds meanwhile.
              proxy_buffering off;
              proxy_read_timeout 5m;
          }
      }

volumes:
  app-storage:
  postgres-data:
  redis-data:
